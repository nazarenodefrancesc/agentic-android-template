name: android-ci

on:
  push:
  pull_request:

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Check
        run: ./scripts/check.sh

  managed-device:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK + emulator
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" emulator
      - name: Managed device smoke
        run: ./scripts/device-check.sh
